const audio=document.getElementById("audio"),library=document.getElementById("library");
const title=document.getElementById("trackTitle"),playBtn=document.getElementById("play");
const seek=document.getElementById("seek"),elapsed=document.getElementById("elapsed"),duration=document.getElementById("duration");
const visual=document.getElementById("visual");
let current=-1, seeking=false;
const bars=Array.from({length:36},(_,i)=>{const b=document.createElement("i");b.className="bar";b.style.setProperty("--h",(18+((i*17)%78))+"%");visual.appendChild(b);return b});
TRACKS.forEach((track,i)=>{const o=document.createElement("option");o.value=String(i);o.textContent=track.title;library.appendChild(o)});
function fmt(v){if(!Number.isFinite(v)||v<0)return"00:00";return String(Math.floor(v/60)).padStart(2,"0")+":"+String(Math.floor(v%60)).padStart(2,"0")}
function setPlaying(on){playBtn.textContent=on?"❚❚":"▶";visual.classList.toggle("playing",on)}
async function playCurrent(){if(current<0){await loadTrack(0,false)}try{await audio.play();setPlaying(true)}catch(e){setPlaying(false);console.warn("El navegador bloqueó la reproducción:",e)}}
async function loadTrack(index,autoplay=true){if(!TRACKS.length)return;current=(index+TRACKS.length)%TRACKS.length;const t=TRACKS[current];audio.pause();audio.src=t.url;audio.load();library.value=String(current);title.textContent=t.title;seek.value="0";elapsed.textContent="00:00";duration.textContent="00:00";setPlaying(false);if(autoplay)await playCurrent()}
playBtn.addEventListener("click",()=>{if(audio.paused)playCurrent();else{audio.pause();setPlaying(false)}});
document.getElementById("next").addEventListener("click",()=>loadTrack(current+1,true));
document.getElementById("prev").addEventListener("click",()=>{if(audio.currentTime>3){audio.currentTime=0;return}loadTrack(current-1,true)});
document.getElementById("stop").addEventListener("click",()=>{audio.pause();audio.currentTime=0;setPlaying(false)});
library.addEventListener("change",()=>{if(library.value!=="")loadTrack(Number(library.value),true)});
document.getElementById("volume").addEventListener("input",e=>audio.volume=Number(e.target.value));
audio.volume=.9;
audio.addEventListener("play",()=>setPlaying(true));audio.addEventListener("pause",()=>setPlaying(false));
audio.addEventListener("timeupdate",()=>{if(!seeking){seek.value=audio.duration?String(Math.round(audio.currentTime/audio.duration*1000)):"0"}elapsed.textContent=fmt(audio.currentTime)});
audio.addEventListener("loadedmetadata",()=>duration.textContent=fmt(audio.duration));
audio.addEventListener("ended",()=>loadTrack(current+1,true));
seek.addEventListener("input",()=>{seeking=true;if(audio.duration)elapsed.textContent=fmt(Number(seek.value)/1000*audio.duration)});
seek.addEventListener("change",()=>{if(audio.duration)audio.currentTime=Number(seek.value)/1000*audio.duration;seeking=false});
if("mediaSession"in navigator){navigator.mediaSession.setActionHandler("play",()=>playCurrent());navigator.mediaSession.setActionHandler("pause",()=>{audio.pause();setPlaying(false)});navigator.mediaSession.setActionHandler("previoustrack",()=>loadTrack(current-1,true));navigator.mediaSession.setActionHandler("nexttrack",()=>loadTrack(current+1,true))}
document.getElementById("count").textContent=TRACKS.length+" canciones · GT-GELM";
</script>
