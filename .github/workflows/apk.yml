name: APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Entorno
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          fi
          java -version
      - run: npm install --no-audit --no-fund
      - run: mkdir -p www && cp -r index.html sw-player.js manifest.webmanifest ICONS www/
      - run: npx cap add android
      - name: Íconos
        run: |
          command -v convert >/dev/null || sudo apt-get install -y -qq imagemagick
          convert ICONS/GT-GELM.png -resize 512x512^ -gravity center -extent 512x512 icon-512.png
          convert icon-512.png -resize 192x192 icon-192.png
          for spec in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            set -- $spec
            mkdir -p "android/app/src/main/res/mipmap-$1"
            convert icon-512.png -resize $2x$2 "android/app/src/main/res/mipmap-$1/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-$1/ic_launcher.png" "android/app/src/main/res/mipmap-$1/ic_launcher_round.png"
            convert ICONS/GT-GELM.png -background none -gravity center -resize $(($3*70/100))x$(($3*70/100)) -extent $3x$3 "android/app/src/main/res/mipmap-$1/ic_launcher_foreground.png"
          done
      - run: cp native/MainActivity.java android/app/src/main/java/com/gelm/musica/MainActivity.java
      - run: cp native/PlaybackService.java android/app/src/main/java/com/gelm/musica/PlaybackService.java
      - name: Permisos y servicio
        run: |
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          perms = ('<uses-permission android:name="android.permission.INTERNET"/>\n'
                   '<uses-permission android:name="android.permission.WAKE_LOCK"/>\n'
                   '<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n'
                   '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n'
                   '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n')
          s = s.replace("<application", perms + "<application", 1)
          s = s.replace("</application>",
                        '<service android:name=".PlaybackService" android:foregroundServiceType="mediaPlayback" android:exported="false"/>\n</application>', 1)
          p.write_text(s)
          EOF
      - run: npx cap copy
      - name: Compilar
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verificar APK
        run: ls -la android/app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: gelm-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK en el sitio
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/gelm.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A apk icon-192.png icon-512.png
          git commit -m "APK actualizado [skip ci]" || echo "sin cambios"
          git fetch origin main
          git pull --rebase origin main || true
          git push origin HEAD:main
