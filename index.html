.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);flex:none}

.hero{position:relative;border-radius:26px;overflow:hidden;padding:22px;background:

.card .art{width:132px;height:132px;border-radius:18px;background:var(--surface2);object-fit:cover}
.card .t{font-size:13px;font-weight:700;margin:8px 0 1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .s{font-size:11.5px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:16px}
.row:active{background:var(--surface2)}
.row.playing .t{color:var(--accent)}
.row .art{width:52px;height:52px;border-radius:13px;background:var(--surface2);object-fit:cover;flex:none}
.row .meta{flex:1;min-width:0}
.row .t{font-size:14.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12px;color:var(--muted)}

.row .more svg{width:18px;height:18px;fill:currentColor}

.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}

.set-item .sub{font-size:12px;color:var(--muted);margin-top:2px}
.switch{width:48px;height:28px;border-radius:999px;background:var(--surface3);position:relative;flex:none;transition:background var(--dur)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform var(--dur)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(20px)}
#mini{position:fixed;left:10px;right:10px;bottom:calc(var(--nav) + 8px + env(safe-area-inset-bottom));height:60px;border-radius:18px;

#mini button{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;flex:none}

#nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);

let toastT;
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2200); }
const fmt = s => { if(!isFinite(s)||s<0) return "0:00"; return Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hash = s => { let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return Math.abs(h).toString(36); };
const PAL = [["#7ee08a","#2bb673"],["#7c4dff","#ff4d94"],["#00b8d4","#2979ff"],["#ff8f00","#ff5252"],["#d500f9","#651fff"]];
const COVERS = new Map();
function coverFor(seed){
  const k = String(seed || "x");
  if(COVERS.has(k)) return COVERS.get(k);
  const p = PAL[parseInt(hash(k),36) % PAL.length];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${p[0]}"/><stop offset="1" stop-color="${p[1]}"/></linearGradient></defs><rect width="300" height="300" fill="url(#g)"/><circle cx="250" cy="55" r="125" fill="#ffffff1a"/><circle cx="55" cy="265" r="95" fill="#00000026"/></svg>`;
  const u = "data:image/svg+xml;utf8," + encodeURIComponent(svg);
  COVERS.set(k, u); return u;
}

/* ---------- YouTube ---------- */
let ytPlayer = null, ytApiP = null, ytTick = null, ytFails = 0, ytArmT = null, ytBlocked = false;

function ytPreload(){
  if(ytApiP) return ytApiP;
  ytApiP = new Promise(res => {
    if(window.YT && window.YT.Player) return res();
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(s);
    window.onYouTubeIframeAPIReady = () => res();
  });
  return ytApiP;
}

function ytAllowAutoplay(){
  const f = document.querySelector("#ytHost iframe");
  if(f) f.setAttribute("allow", "autoplay; encrypted-media; picture-in-picture; fullscreen");
}

function ensurePlayer(vid){
  if(ytPlayer) return true;
  if(!(window.YT && window.YT.Player)) return false;
  ytPlayer = new YT.Player("ytHost", {
    width: 200, height: 120, videoId: vid,
    playerVars: { autoplay: 1, mute: 1, controls: 0, playsinline: 1, rel: 0, modestbranding: 1, enablejsapi: 1, origin: location.origin },
    events: {
      onReady: e => {
        ytAllowAutoplay();
        try{ e.target.setVolume(100) }catch(err){}
        try{ e.target.playVideo() }catch(err){}
        ytArm();
      },
      onStateChange: e => {
        if(e.data === 1){
          ytFails = 0; ytBlocked = false; clearTimeout(ytArmT);
          setPlayIcon(true); updateSession(); ytTitle(); ytStartTick();
          try{ ytPlayer.unMute() }catch(err){}
          setTimeout(() => { try{ if(ytPlayer.isMuted()) ytPlayer.unMute() }catch(err){} }, 700);
        }
        if(e.data === 2){ setPlayIcon(false); ytStopTick(); }
        if(e.data === 0) next(true);
      },
      onError: () => {
        ytStopTick();
        if(++ytFails > 10){ ytFails = 0; setPlayIcon(false); toast("YouTube no responde"); return; }
        setTimeout(()=>next(true), 500);
      }
    }
  });
  setTimeout(ytAllowAutoplay, 0);
  setTimeout(ytAllowAutoplay, 400);
  return true;
}

/* si en 3 s no arrancó, insistimos y avisamos para que toques play */
function ytArm(){
  clearTimeout(ytArmT);
  ytArmT = setTimeout(() => {
    let st = -1;
    try{ st = ytPlayer.getPlayerState() }catch(e){}
    if(st === 1 || st === 3) return;
    try{ ytPlayer.playVideo() }catch(e){}
    setTimeout(() => {
      let st2 = -1;
      try{ st2 = ytPlayer.getPlayerState() }catch(e){}
      if(st2 !== 1 && st2 !== 3 && !ytBlocked){
        ytBlocked = true; setPlayIcon(false);
        toast("Toca ▶ para activar el audio");
      }
    }, 1400);
  }, 3000);
}

function ytTitle(){
  try{
    const d = ytPlayer.getVideoData();
    if(d && d.title){ $("#pT").textContent = d.title; $("#miniT").textContent = d.title; }
  }catch(e){}
}
function ytStartTick(){
  ytStopTick();
  ytTick = setInterval(() => {
    try{
      const d = ytPlayer.getDuration(), t = ytPlayer.getCurrentTime();
      if(!seekDrag && d) $("#pSeek").value = Math.round(t/d*1000);
      $("#pCur").textContent = fmt(t);
      $("#pDur").textContent = fmt(d);
      $("#miniBar").style.width = d ? (t/d*100)+"%" : "0%";
    }catch(e){}
  }, 900);
}
function ytStopTick(){ if(ytTick) clearInterval(ytTick); ytTick = null; }

function ytPlay(t){
  ytBlocked = false;
  if(!ytPlayer){
    if(ensurePlayer(t.vid)) return;
    ytPreload().then(() => { if(cur()?.vid === t.vid && !ytPlayer) ensurePlayer(t.vid); })
      .catch(()=> toast("YouTube no cargó"));
    return;
  }
  try{ ytPlayer.loadVideoById(t.vid); ytArm(); }
  catch(e){ setTimeout(()=>{ try{ ytPlayer.loadVideoById(t.vid); ytArm() }catch(_){} }, 400); }
}
function ytPause(){ try{ ytPlayer?.pauseVideo() }catch(e){} clearTimeout(ytArmT); }

/* ---------- carga del JSON local ---------- */
function normalize(data, base){
  const arr = Array.isArray(data) ? data : (data.songs || data.tracks || data.music || data.data || []);
  if(!Array.isArray(arr)) return [];
  const out = [], seen = new Set();
  arr.forEach(raw => {
    if(!raw) return;
    const file = raw.file || "";
    let url = raw.url || raw.src || raw.path || raw.audio || file;
    if(!url) return;
    if(!/^(https?:|data:|blob:)/.test(url)){ try{ url = new URL(url, base).href }catch(e){} }
    const id = "L" + String(raw.id ?? hash(url));
    if(seen.has(id)) return; seen.add(id);
    let title = String(raw.title || raw.name || file || "Sin título");
    let num = "";
    const m = title.match(/^(\d{1,4})[\s._\-–]+(.+)$/);
    if(m){ num = m[1]; title = m[2]; }
    out.push({ id, src: "local", num, title, artist: "GELM", album: "Colección local",
      cover: coverFor(id), url, dur: Number(raw.duration || 0) || 0 });
  });
  return out.sort((a,b) => (parseInt(a.num,10)||9999) - (parseInt(b.num,10)||9999));
}

async function loadLocal(silent){
  if(!silent) toast("Cargando biblioteca…");
  let data = null, base = location.href;
  for(const s of SOURCES){
    try{
      const abs = new URL(s, location.href).href;
      const r = await fetch(abs, { cache: "no-cache" });
      if(!r.ok) continue;
      data = await r.json(); base = abs; break;
    }catch(e){}
  }
  if(!data){
    const c = LS.get("lib", null);
    if(c?.length){ state.tracks = c; state.byId = new Map(c.map(t=>[t.id,t])); renderAll(); }
    return;
  }
  state.tracks = normalize(data, base);
  state.byId = new Map(state.tracks.map(t=>[t.id,t]));
  LS.set("lib", state.tracks);
  renderAll();
  if(!silent) toast(state.tracks.length + " pistas cargadas");
}

function virtualList(container, items, rowFn, onPlay){
  if(container._io) container._io.disconnect();
  container.innerHTML = "";
  let i = 0;
  const CHUNK = document.body.classList.contains("lowend") ? 30 : 55;
  const sentinel = document.createElement("div");
  sentinel.className = "sentinel";
  const add = () => {
    const end = Math.min(i + CHUNK, items.length);
    let html = "";
    for(; i < end; i++) html += rowFn(items[i]);
    sentinel.insertAdjacentHTML("beforebegin", html);
  };
  const io = new IntersectionObserver(es => { if(es[0].isIntersecting) add(); }, { root: $("#main"), rootMargin: "700px" });
  container._io = io;
  container.appendChild(sentinel);
  add(); io.observe(sentinel);

  container.onclick = e => {
    const m = e.target.closest("[data-menu]");
    if(m){ openMenu(m.dataset.menu); return; }
    const row = e.target.closest(".row"); if(!row) return;
    const idx = items.findIndex(t => t.id === row.dataset.id);
    if(idx >= 0) onPlay(items, idx);
  };
}

    <div class="set-item" style="flex-direction:column;align-items:stretch;gap:6px">
      <div class="lab">Fuentes</div>
      <div class="sub">YouTube: playlist oficial GT-GELM (94 pistas incrustadas).</div>
      <div class="sub">MP3: songs.json del repositorio.</div>
    </div>`;
  $("#swAnim").onclick = e => { e.currentTarget.classList.toggle("on"); document.body.classList.toggle("lowend", !e.currentTarget.classList.contains("on")); };
  $("#swOff").onclick = e => {
    const on = e.currentTarget.classList.toggle("on"); LS.set("offline", on);
    navigator.serviceWorker?.controller?.postMessage({ type: "offline", on });
  };
  $("#wipe").onclick = () => {
    if(!confirm("¿Borrar datos locales?")) return;
    ["favs","playlists","recents","pos"].forEach(LS.del);
    state.favs.clear(); state.playlists = {}; state.recents = [];
    renderAll(); toast("Datos borrados");
  };
}

/* ---------- navegación ---------- */
const TITLES = { home:"GELM · Música", lib:"Biblioteca", pl:"Playlists", set:"Ajustes", detail:"" };
function go(view){
  state.view = view;
  ["home","lib","pl","set","detail"].forEach(v => $("#view-"+v).classList.toggle("hide", v !== view));
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.go === view));
  $("#title").textContent = TITLES[view];
  $("#main").scrollTop = 0;
}
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => {
  if(b.dataset.go === "lib"){ state.libFilter = "all"; renderLib(); }
  go(b.dataset.go);
});
document.querySelectorAll("#srcBar button").forEach(b => b.onclick = () => setSrc(b.dataset.src));
$("#btnReload").onclick = () => { loadYt(); loadLocal(); toast("Actualizado"); };

function setSrc(s){
  if(state.src === s) return;
  stopAll();
  state.src = s; LS.set("src", s);
  document.querySelectorAll("#srcBar button").forEach(b => b.classList.toggle("on", b.dataset.src === s));
  $("#view-lib").dataset.q = "";
  state.libFilter = "all";
  renderAll();
  go("home");
}

/* ---------- reproducción ---------- */
function stopAll(){
  audio.pause();
  ytPause();
  ytStopTick();
  setPlayIcon(false);
}

function playList(list, index){
  if(!list || !list.length) return;
  state.queue = list.slice(); state.qi = index || 0;
  startCurrent(true); openPlayer();
}
function playTrack(t){
  const l = activeList();
  const i = l.findIndex(x => x.id === t.id);
  playList(i >= 0 ? l : [t], i >= 0 ? i : 0);
}

function startCurrent(autoplay){
  const t = cur(); if(!t) return;
  fails = 0; ytBlocked = false;
  $("#pT").textContent = t.title;
  $("#pS").textContent = t.artist + " · " + t.album;
  $("#pArt").src = t.cover;
  $("#pBg").style.backgroundImage = `url("${t.cover}")`;
  $("#miniT").textContent = t.title;
  $("#miniS").textContent = t.album;
  $("#miniArt").src = t.cover;
  $("#mini").classList.remove("hide");
  $("#pFav").classList.toggle("on", state.favs.has(t.id));
  $("#pDur").textContent = t.dur ? fmt(t.dur) : "0:00";
  $("#pCur").textContent = "0:00";
  $("#pSeek").value = 0;
  document.documentElement.style.setProperty("--accent", PAL[parseInt(hash(t.id),36)%PAL.length][0]);
  state.recents = [t.id, ...state.recents.filter(i => i !== t.id)].slice(0,60);
  LS.set("recents", state.recents);
  document.querySelectorAll(".row.playing").forEach(r => r.classList.remove("playing"));

  if(t.src === "yt"){
    audio.pause(); audio.removeAttribute("src");
    if(autoplay) ytPlay(t); else ytPause();
    updateSession();
  }else{
    ytPause(); ytStopTick();
    audio.src = t.url;
    if(autoplay) audio.play().catch(()=>{});
    updateSession();
  }
}

function next(auto){
  if(!state.queue.length) return;
  if(state.repeat === "off" && auto && state.qi >= state.queue.length - 1){ stopAll(); return; }
  state.qi = state.shuffle ? Math.floor(Math.random()*state.queue.length) : (state.qi + 1) % state.queue.length;
  startCurrent(true);
}
function prev(){
  const t = cur();
  if(t?.src === "local" && audio.currentTime > 3){ audio.currentTime = 0; return; }
  if(t?.src === "yt"){ try{ if(ytPlayer.getCurrentTime() > 3){ ytPlayer.seekTo(0); return; } }catch(e){} }
  if(!state.queue.length) return;
  state.qi = (state.qi - 1 + state.queue.length) % state.queue.length;
  startCurrent(true);
}
function toggle(){
  const t = cur(); if(!t) return;
  if(t.src === "yt"){
    try{
      if(ytPlayer.getPlayerState() === 1){ ytPlayer.pauseVideo(); }
      else { ytBlocked = false; ytPlayer.playVideo(); try{ ytPlayer.unMute() }catch(e){} ytArm(); }
    }catch(e){ ytPlay(t); }
  }else{
    if(!audio.src) return;
    audio.paused ? audio.play() : audio.pause();
  }
}

$("#pPlay").onclick = toggle; $("#miniPlay").onclick = toggle;
$("#pNext").onclick = () => next(false); $("#miniNext").onclick = () => next(false);
$("#pPrev").onclick = prev;

$("#pShuffle").onclick = e => { state.shuffle = !state.shuffle; e.currentTarget.classList.toggle("on", state.shuffle); LS.set("shuffle", state.shuffle); };
$("#pRepeat").onclick = e => {
  state.repeat = state.repeat === "off" ? "all" : state.repeat === "all" ? "one" : "off";
  e.currentTarget.classList.toggle("on", state.repeat !== "off");
  e.currentTarget.style.opacity = state.repeat === "one" ? ".55" : "1";
  LS.set("repeat", state.repeat);
  toast(state.repeat === "off" ? "Repetir desactivado" : state.repeat === "all" ? "Repetir cola" : "Repetir pista");
};
$("#pShuffle").classList.toggle("on", state.shuffle);
$("#pRepeat").classList.toggle("on", state.repeat !== "off");

$("#pFav").onclick = () => {
  const t = cur(); if(!t) return;
  state.favs.has(t.id) ? state.favs.delete(t.id) : state.favs.add(t.id);
  LS.set("favs", [...state.favs]);
  $("#pFav").classList.toggle("on", state.favs.has(t.id));
  renderHome(); renderLib();
};
$("#pList").onclick = openQueue;
$("#pSleep").onclick = () => {
  const v = prompt("Minutos para detener (vacío = cancelar):\n15, 30, 45, 60, 90");
  clearTimeout(state.sleepTimer);
  if(!v) return toast("Temporizador cancelado");
  const min = parseInt(v,10); if(!min) return;
  state.sleepTimer = setTimeout(() => { stopAll(); toast("Reproducción detenida"); }, min*60000);
  toast("Se detendrá en " + min + " min");
};

$("#pSeek").addEventListener("input", () => seekDrag = true);
$("#pSeek").addEventListener("change", e => {
  const t = cur(); if(!t) return;
  const pct = e.target.value / 1000;
  if(t.src === "yt"){ try{ ytPlayer.seekTo(ytPlayer.getDuration()*pct, true) }catch(err){} }
  else if(audio.duration) audio.currentTime = audio.duration * pct;
  seekDrag = false;
});

function openPlayer(){ $("#player").classList.add("open"); }
$("#pDown").onclick = () => $("#player").classList.remove("open");
$("#mini").onclick = e => { if(!e.target.closest("button")) openPlayer(); };

/* ---------- cola ---------- */
function openQueue(){
  const up = state.queue.slice(state.qi + 1);
  $("#queue").innerHTML = `<div class="grab"></div>
    <div class="qhead"><h3>A continuación (${up.length})</h3><button id="clearQ">Vaciar</button></div>
    ${up.length ? `<div class="list">${up.map((t,i) => `
      <div class="row" data-q="${state.qi+1+i}">
        <img class="art" src="${t.cover}" alt="" loading="lazy">
        <div class="meta"><div class="t">${esc(t.title)}</div><div class="s">${esc(t.album)}</div></div>
      </div>`).join("")}</div>`
    : `<div class="empty">No hay nada más en la cola.</div>`}`;
  $("#clearQ").onclick = () => { state.queue = state.queue.slice(0, state.qi+1); closeSheets(); toast("Cola vaciada"); };
  $("#queue").querySelectorAll("[data-q]").forEach(r => r.onclick = () => {
    state.qi = Number(r.dataset.q); startCurrent(true); closeSheets();
  });
  $("#queue").classList.add("open"); $("#scrim").classList.add("on");
}

/* ---------- menú ---------- */
function openMenu(id){
  const t = lookup(id); if(!t) return;
  const names = Object.keys(state.playlists);
  $("#menu").innerHTML = `<div class="grab"></div>
    <div class="mi" data-act="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Reproducir</div>
    <div class="mi" data-act="next"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Reproducir siguiente</div>
    <div class="mi" data-act="fav"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.7-9.3-9A5.2 5.2 0 0 1 12 6.6 5.2 5.2 0 0 1 21.3 12c-1.8 4.3-9.3 9-9.3 9z"/></svg>
      ${state.favs.has(id) ? "Quitar de favoritos" : "Añadir a favoritos"}</div>
    <div class="mi" data-act="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Añadir a playlist</div>
    ${t.src === "yt" ? `<div class="mi" data-act="open"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4 10 14M18 14v6H4V6h6"/></svg>Abrir en YouTube</div>` : ""}`;
  $("#menu").querySelectorAll("[data-act]").forEach(el => el.onclick = () => {
    const a = el.dataset.act;
    if(a === "play") playTrack(t);
    if(a === "next"){ state.queue.splice(state.qi+1, 0, t); toast("Añadida a la cola"); }
    if(a === "fav"){ state.favs.has(id) ? state.favs.delete(id) : state.favs.add(id); LS.set("favs", [...state.favs]); renderHome(); renderLib(); }
    if(a === "open") window.open("https://www.youtube.com/watch?v=" + t.vid, "_blank");
    if(a === "add"){
      const n = prompt("Nombre de la playlist", names[0] || "");
      if(n){ state.playlists[n] = state.playlists[n] || []; state.playlists[n].push(id); LS.set("playlists", state.playlists); renderPlaylists(); toast("Añadida"); }
    }
    closeSheets();
  });
  $("#menu").classList.add("open"); $("#scrim").classList.add("on");
}
function closeSheets(){ $("#menu").classList.remove("open"); $("#queue").classList.remove("open"); $("#scrim").classList.remove("on"); }
$("#scrim").onclick = closeSheets;
$("#pMenu").onclick = () => cur() && openMenu(cur().id);

/* ---------- MediaSession ---------- */
function updateSession(){
  if(!("mediaSession" in navigator)) return;
  const t = cur(); if(!t) return;
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.title, artist: t.artist, album: t.album,
      artwork: [{ src: t.cover, sizes: "300x300", type: "image/jpeg" }]
    });
    navigator.mediaSession.setActionHandler("play", toggle);
    navigator.mediaSession.setActionHandler("pause", toggle);
    navigator.mediaSession.setActionHandler("previoustrack", prev);
    navigator.mediaSession.setActionHandler("nexttrack", () => next(false));
    navigator.mediaSession.setActionHandler("seekto", d => {
      const c = cur();
      if(c?.src === "yt"){ try{ ytPlayer.seekTo(d.seekTime, true) }catch(e){} }
      else audio.currentTime = d.seekTime;
    });
  }catch(e){}
}

/* ---------- arranque ---------- */
loadYt();
ytPreload();
const cachedLocal = LS.get("lib", null);
if(cachedLocal?.length){ state.tracks = cachedLocal; state.byId = new Map(cachedLocal.map(t=>[t.id,t])); }
document.querySelectorAll("#srcBar button").forEach(b => b.classList.toggle("on", b.dataset.src === state.src));
renderAll();
loadLocal(true);

const last = LS.get("pos", null);
if(last?.id) setTimeout(() => {
  const t = lookup(last.id);
  if(t){ state.queue = [t]; state.qi = 0; startCurrent(false); }
}, 900);

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw-player.js").catch(()=>{});
  navigator.storage?.persist?.();
}
</script>
</body>
</html>
