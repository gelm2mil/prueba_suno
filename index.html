<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GELM · Música</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#0b0b0f; --surface:#14141a; --surface2:#1d1d26; --surface3:#262632;
  --text:#efeaf6; --muted:#a49fb8; --line:#2a2a36;
  --accent:#c9a8ff; --accent-ink:#180f2b;
  --r:20px; --dur:230ms; --nav:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg)}
body{color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  overscroll-behavior-y:none;overflow:hidden}
body.lowend{--dur:0ms}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
.hide{display:none!important}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#topbar{display:flex;align-items:center;gap:10px;padding:14px 18px 8px}
#topbar h1{font-size:22px;font-weight:800;letter-spacing:-.4px;margin:0;flex:1}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);flex:none}
.iconbtn:active{background:var(--surface3)}
.iconbtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav) + 84px + env(safe-area-inset-bottom))}
.view{padding:0 14px 10px}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 10px}
.sect-h h2{font-size:16px;font-weight:800;margin:0}
.sect-h button{font-size:12.5px;font-weight:700;color:var(--accent)}
.hero{position:relative;border-radius:26px;overflow:hidden;padding:22px;background:
  radial-gradient(120% 120% at 15% 0%,color-mix(in srgb,var(--accent) 42%,#000) 0%,#15121d 62%,#0d0c12 100%)}
.hero h2{margin:0 0 4px;font-size:26px;line-height:1.1;font-weight:900;letter-spacing:-.8px}
.hero p{margin:0 0 18px;color:#d6cfe6;font-size:13.5px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);font-weight:800;border-radius:999px;padding:13px 22px;font-size:14px}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px;fill:currentColor;stroke:none}
.btn.ghost{background:var(--surface2);color:var(--text)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 15px;border-radius:999px;background:var(--surface2);font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.carousel{display:flex;gap:12px;overflow-x:auto;padding:2px 4px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.card{flex:none;width:132px;scroll-snap-align:start}
.card .art{width:132px;height:132px;border-radius:18px;background:var(--surface2);object-fit:cover}
.card .t{font-size:13px;font-weight:700;margin:8px 0 1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .s{font-size:11.5px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:16px}
.row:active{background:var(--surface2)}
.row.playing .t{color:var(--accent)}
.row .art{width:52px;height:52px;border-radius:13px;background:var(--surface2);object-fit:cover;flex:none}
.row .meta{flex:1;min-width:0}
.row .t{font-size:14.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12px;color:var(--muted)}
.row .num{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:26px;text-align:right;flex:none}
.row .more{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.row .more svg{width:18px;height:18px;fill:currentColor}
.sentinel{height:1px}
.det-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 6px 18px}
.det-head .art{width:186px;height:186px;border-radius:24px;object-fit:cover;background:var(--surface2);box-shadow:0 18px 44px -14px #000}
.det-head h2{margin:16px 0 4px;font-size:21px;font-weight:900;letter-spacing:-.5px}
.det-head p{margin:0 0 16px;color:var(--muted);font-size:13px}
.det-actions{display:flex;gap:10px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:999px;padding:11px 16px;margin:4px 4px 12px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:15px;min-width:0}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.set-item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 4px;border-bottom:1px solid var(--line)}
.set-item .lab{font-size:14.5px;font-weight:600}
.set-item .sub{font-size:12px;color:var(--muted);margin-top:2px}
.set-item input[type=text]{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--text);font-size:13px;outline:0}
.switch{width:48px;height:28px;border-radius:999px;background:var(--surface3);position:relative;flex:none;transition:background var(--dur)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform var(--dur)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(20px)}
#mini{position:fixed;left:10px;right:10px;bottom:calc(var(--nav) + 8px + env(safe-area-inset-bottom));height:60px;border-radius:18px;
  background:var(--surface2);display:flex;align-items:center;gap:11px;padding:8px 10px;z-index:30;box-shadow:0 10px 26px -8px #000}
#mini .art{width:44px;height:44px;border-radius:11px;object-fit:cover;background:var(--surface3);flex:none}
#mini .meta{flex:1;min-width:0}
#mini .t{font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mini .s{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mini .bar{position:absolute;left:10px;right:10px;bottom:3px;height:2.5px;border-radius:2px;background:#ffffff22;overflow:hidden}
#mini .bar i{display:block;height:100%;background:var(--accent);width:0}
#mini button{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;flex:none}
#mini button svg{width:22px;height:22px;fill:currentColor}
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  display:flex;background:#0e0e14e6;border-top:1px solid #ffffff0d;z-index:31}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:700}
#nav button.on{color:var(--accent)}
#nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#nav button.on svg{fill:currentColor;stroke:none;opacity:.9}
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 6px) 20px calc(env(safe-area-inset-bottom) + 18px);
  transform:translateY(100%);transition:transform var(--dur) cubic-bezier(.22,1,.36,1)}
.sheet.open{transform:none}
.sheet .bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.42;filter:blur(34px) saturate(1.4);transform:scale(1.25);z-index:-1}
.sheet .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#00000055,#000000e0 62%,#0b0b0f 100%)}
body.lowend .sheet .bg{filter:none;opacity:.3}
.pl-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.pl-top .iconbtn{background:#ffffff14}
.pl-top .cap{font-size:11.5px;font-weight:800;letter-spacing:1.3px;color:var(--muted);text-transform:uppercase}
.pl-art{width:min(78vw,320px);aspect-ratio:1;border-radius:26px;object-fit:cover;margin:auto;background:var(--surface2);box-shadow:0 24px 60px -18px #000}
.pl-info{margin-top:20px}
.pl-info h2{font-size:22px;font-weight:900;letter-spacing:-.5px;margin:0 0 4px;line-height:1.2}
.pl-info p{color:var(--muted);font-size:13.5px;margin:0}
.seek{margin:22px 0 4px}
.seek input{width:100%;-webkit-appearance:none;height:26px;background:none}
.seek input::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:#ffffff2e}
.seek input::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);margin-top:-5px}
.seek .times{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.controls{display:flex;align-items:center;justify-content:space-between;margin:16px 0 10px}
.controls button{width:52px;height:52px;display:grid;place-items:center;border-radius:50%;color:var(--text)}
.controls svg{width:26px;height:26px;fill:currentColor;stroke:none}
.controls .sm svg{width:22px;height:22px}
.controls button.on{color:var(--accent)}
.controls .play{width:74px;height:74px;background:var(--accent);color:var(--accent-ink)}
.controls .play svg{width:32px;height:32px}
.pl-extra{display:flex;justify-content:space-around;margin-top:auto;padding-top:10px;border-top:1px solid #ffffff12}
.pl-extra button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);font-weight:700;padding:10px 6px}
.pl-extra button.on{color:var(--accent)}
.pl-extra svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#menu{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--surface);border-radius:26px 26px 0 0;
  padding:10px 14px calc(env(safe-area-inset-bottom) + 14px);transform:translateY(100%);transition:transform var(--dur)}
#menu.open{transform:none}
#menu .grab{width:40px;height:4px;border-radius:2px;background:#ffffff2b;margin:0 auto 12px}
#menu .mi{display:flex;align-items:center;gap:14px;padding:15px 8px;font-size:14.5px;font-weight:600;border-bottom:1px solid var(--line)}
#menu .mi:last-child{border:0}
#menu .mi svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;color:var(--muted)}
#scrim{position:fixed;inset:0;background:#000a;z-index:65;opacity:0;pointer-events:none;transition:opacity var(--dur)}
#scrim.on{opacity:1;pointer-events:auto}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 82px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:var(--surface3);color:var(--text);padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;
  z-index:80;opacity:0;pointer-events:none;transition:all var(--dur);max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--muted);padding:52px 24px;font-size:14px}
.empty svg{width:52px;height:52px;stroke:var(--surface3);fill:none;stroke-width:1.4;margin:0 auto 14px}
@media(prefers-reduced-motion:reduce){:root{--dur:0ms}}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <h1 id="title">GELM · Música</h1>
    <button class="iconbtn" id="btnReload" title="Recargar">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>
    </button>
  </header>
  <main id="main">
    <section class="view" id="view-home"></section>
    <section class="view hide" id="view-lib"></section>
    <section class="view hide" id="view-pl"></section>
    <section class="view hide" id="view-detail"></section>
    <section class="view hide" id="view-set"></section>
  </main>
  <div id="mini" class="hide">
    <img class="art" id="miniArt" alt="">
    <div class="meta"><div class="t" id="miniT"></div><div class="s" id="miniS"></div></div>
    <button id="miniPlay"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    <button id="miniNext"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z"/></svg></button>
    <div class="bar"><i id="miniBar"></i></div>
  </div>
  <nav id="nav">
    <button data-go="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg><span>Inicio</span></button>
    <button data-go="lib"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Biblioteca</span></button>
    <button data-go="pl"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Playlists</span></button>
    <button data-go="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a1.7 1.7 0 0 0-1.6-1H1a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 3 8.6a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 8.4 3H8.5A1.7 1.7 0 0 0 10 1.4V1a2 2 0 1 1 4 0v.1A1.7 1.7 0 0 0 15.6 3a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Ajustes</span></button>
  </nav>
</div>

<div id="scrim"></div>

<div class="sheet" id="player">
  <div class="bg" id="pBg"></div>
  <div class="pl-top">
    <button class="iconbtn" id="pDown"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <span class="cap" id="pFrom">Reproduciendo</span>
    <button class="iconbtn" id="pMenu"><svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  </div>
  <img class="pl-art" id="pArt" alt="">
  <div class="pl-info"><h2 id="pT"></h2><p id="pS"></p></div>
  <div class="seek">
    <input type="range" id="pSeek" min="0" max="1000" value="0" step="1">
    <div class="times"><span id="pCur">0:00</span><span id="pDur">0:00</span></div>
  </div>
  <div class="controls">
    <button class="sm" id="pShuffle"><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
    <button id="pPrev"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
    <button class="play" id="pPlay"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    <button id="pNext"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    <button class="sm" id="pRepeat"><svg viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2"><path d="M17 2l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
  </div>
  <div class="pl-extra">
    <button id="pFav"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.7-9.3-9A5.2 5.2 0 0 1 12 6.6 5.2 5.2 0 0 1 21.3 12c-1.8 4.3-9.3 9-9.3 9z"/></svg><span>Favorito</span></button>
    <button id="pSleep"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span>Dormir</span></button>
    <button id="pList"><svg viewBox="0 0 24 24"><path d="M4 6h11M4 12h11M4 18h7M17 14v6M20 16v4"/></svg><span>Cola</span></button>
  </div>
</div>

<div id="menu"></div>
<div id="toast"></div>
<audio id="audio" preload="metadata"></audio>

<script>
"use strict";
/* ============ FUENTES DE DATOS (ya configuradas) ============ */
const REPO_RAW = "https://raw.githubusercontent.com/gelm2mil/prueba_suno/main/songs.json";
const SOURCES = ["songs.json", REPO_RAW];

const LS = {
  get(k, d){ try{ const v = localStorage.getItem("gl_"+k); return v===null?d:JSON.parse(v) }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem("gl_"+k, JSON.stringify(v)) }catch(e){} },
  del(k){ try{ localStorage.removeItem("gl_"+k) }catch(e){} }
};
const $ = s => document.querySelector(s);
const audio = $("#audio");

const state = {
  tracks: [], byId: new Map(), cats: [],
  queue: [], qi: -1,
  shuffle: LS.get("shuffle", false), repeat: LS.get("repeat", "off"),
  favs: new Set(LS.get("favs", [])),
  recents: LS.get("recents", []),
  playlists: LS.get("playlists", {}),
  libFilter: "all", view: "home", menuTarget: null, sleepTimer: null
};

let toastT;
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2000); }
const fmt = s => { if(!isFinite(s)||s<0) return "0:00"; return Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hash = s => { let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return Math.abs(h).toString(36); };

/* ---- portadas generadas por categoría (sin imágenes, sin datos) ---- */
const PAL = [["#7c4dff","#ff4d94"],["#00b8d4","#2979ff"],["#ff8f00","#ff5252"],["#00c853","#00bfa5"],["#d500f9","#651fff"],["#ff6d00","#ffd600"]];
const COVERS = new Map();
function coverFor(cat){
  const key = cat || "?";
  if(COVERS.has(key)) return COVERS.get(key);
  const p = PAL[parseInt(hash(key),36) % PAL.length];
  const letter = (key === "pmt" ? "P" : key.slice(0,1)).toUpperCase();
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${p[0]}"/><stop offset="1" stop-color="${p[1]}"/></linearGradient></defs><rect width="300" height="300" fill="url(#g)"/><circle cx="250" cy="55" r="125" fill="#ffffff1a"/><circle cx="55" cy="265" r="95" fill="#00000026"/><text x="150" y="200" font-family="system-ui,sans-serif" font-size="150" font-weight="800" fill="#ffffffd0" text-anchor="middle">${letter}</text></svg>`;
  const uri = "data:image/svg+xml;utf8," + encodeURIComponent(svg);
  COVERS.set(key, uri);
  return uri;
}
const LABEL = c => ({cultura:"Cultura", historias:"Historias", pmt:"PMT"}[c] || (c ? c[0].toUpperCase()+c.slice(1) : "General"));

(function device(){
  const mem = navigator.deviceMemory || 4, cpu = navigator.hardwareConcurrency || 4;
  if(mem <= 3 || cpu <= 4) document.body.classList.add("lowend");
})();

/* ---- audio ---- */
audio.addEventListener("timeupdate", () => {
  const d = audio.duration || 0;
  $("#pCur").textContent = fmt(audio.currentTime);
  $("#miniBar").style.width = d ? (audio.currentTime/d*100)+"%" : "0%";
  if(!seekDrag) $("#pSeek").value = d ? Math.round(audio.currentTime/d*1000) : 0;
  if(Math.floor(audio.currentTime) % 5 === 0) LS.set("pos", { id: cur()?.id, t: audio.currentTime });
});
audio.addEventListener("loadedmetadata", () => $("#pDur").textContent = fmt(audio.duration));
audio.addEventListener("play", () => { setPlayIcon(true); updateSession(); });
audio.addEventListener("pause", () => setPlayIcon(false));
audio.addEventListener("ended", () => { if(state.repeat === "one"){ audio.currentTime = 0; audio.play(); } else next(true); });
audio.addEventListener("error", () => { if(!audio.src) return; toast("No se pudo reproducir"); setTimeout(()=>next(true), 700); });

function setPlayIcon(on){
  const svg = on ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  $("#pPlay").innerHTML = svg; $("#miniPlay").innerHTML = svg;
}
const cur = () => state.queue[state.qi] || null;

/* ---- lectura y normalización del JSON ---- */
function normalize(data, base){
  const arr = Array.isArray(data) ? data
    : (data.songs || data.tracks || data.music || data.data || data.items || []);
  if(!Array.isArray(arr)) return [];
  const out = [], seen = new Set();
  arr.forEach(raw => {
    if(!raw) return;
    const file = raw.file || "";
    let url = raw.url || raw.src || raw.path || raw.audio || file;
    if(!url) return;
    if(!/^(https?:|data:|blob:)/.test(url)) { try{ url = new URL(url, base).href }catch(e){} }
    const id = String(raw.id ?? hash(url));
    if(seen.has(id)) return; seen.add(id);
    const cat = String(raw.category || raw.album || "").toLowerCase();
    let title = String(raw.title || raw.name || file || "Sin título");
    let num = "";
    const m = title.match(/^(\d{1,4})[\s._\-–]+(.+)$/);
    if(m){ num = m[1]; title = m[2]; }
    out.push({ id, num, title, cat, artist: "GELM", album: LABEL(cat), cover: coverFor(cat), url, dur: 0 });
  });
  return out.sort((a,b) => (parseInt(a.num,10)||9999) - (parseInt(b.num,10)||9999));
}

async function loadLibrary(silent){
  if(!silent) toast("Cargando biblioteca…");
  let data = null, usedBase = location.href;
  for(const src of SOURCES){
    try{
      const abs = new URL(src, location.href).href;
      const res = await fetch(abs, { cache: "no-cache" });
      if(!res.ok) continue;
      data = await res.json();
      usedBase = abs;
      break;
    }catch(e){}
  }
  if(!data){
    const cache = LS.get("lib", null);
    if(cache?.length){ state.tracks = cache; hydrate(); renderAll(); toast("Sin conexión: copia local"); }
    else renderEmpty("No se pudo leer songs.json. Revisa la conexión.");
    return;
  }
  const tracks = normalize(data, usedBase);
  if(!tracks.length){ renderEmpty("songs.json no tiene pistas válidas."); return; }
  state.tracks = tracks;
  LS.set("lib", tracks);
  hydrate();
  renderAll();
  if(!silent) toast(tracks.length + " pistas cargadas");
}

function hydrate(){
  state.byId = new Map(state.tracks.map(t => [t.id, t]));
  state.cats = [...new Set(state.tracks.map(t => t.cat))].filter(Boolean);
}

function renderEmpty(msg){
  $("#view-home").innerHTML = `<div class="empty">
    <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    <p>${esc(msg)}</p></div>`;
}

/* ---- render ---- */
function renderAll(){ renderHome(); renderLib(); renderPlaylists(); renderSettings(); }

function renderHome(){
  const v = $("#view-home");
  const recents = state.recents.map(id => state.byId.get(id)).filter(Boolean).slice(0,12);
  const favs = [...state.favs].map(id => state.byId.get(id)).filter(Boolean).slice(0,12);
  const last = LS.get("pos", null);
  const lastT = last && state.byId.get(last.id);

  v.innerHTML = `
    <div class="hero">
      <h2>GELM<br>Colección completa</h2>
      <p>${state.tracks.length} audios · ${state.cats.length} categorías</p>
      <button class="btn" id="heroShuffle">
        <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        Aleatorio
      </button>
      ${lastT ? `<button class="btn ghost" id="heroResume" style="margin-left:8px">Continuar</button>` : ""}
    </div>
    ${recents.length ? `<div class="sect-h"><h2>Escuchado hace poco</h2></div>
      <div class="carousel" data-carousel="recent">${recents.map(cardHTML).join("")}</div>` : ""}
    ${favs.length ? `<div class="sect-h"><h2>Favoritos</h2></div>
      <div class="carousel" data-carousel="favs">${favs.map(cardHTML).join("")}</div>` : ""}
    <div class="sect-h"><h2>Categorías</h2></div>
    <div class="carousel">${state.cats.map(c => {
      const n = state.tracks.filter(t => t.cat === c).length;
      return `<button class="card" data-cat="${esc(c)}">
        <img class="art" src="${coverFor(c)}" alt="">
        <div class="t">${esc(LABEL(c))}</div><div class="s">${n} pistas</div>
      </button>`;
    }).join("")}</div>`;

  $("#heroShuffle").onclick = () => { if(state.tracks.length) playList(state.tracks.slice().sort(()=>Math.random()-.5), 0); };
  if(lastT) $("#heroResume").onclick = () => {
    state.queue = [lastT]; state.qi = 0; loadCurrent(false); audio.currentTime = last.t || 0; openPlayer();
  };
  v.querySelectorAll("[data-carousel]").forEach(c => {
    c.onclick = e => {
      const b = e.target.closest("[data-id]"); if(!b) return;
      const ids = [...c.querySelectorAll("[data-id]")].map(x => x.dataset.id);
      playList(ids.map(i => state.byId.get(i)).filter(Boolean), ids.indexOf(b.dataset.id));
    };
  });
  v.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => openDetail("cat", b.dataset.cat));
}

const cardHTML = t => `<button class="card" data-id="${t.id}">
  <img class="art" src="${t.cover}" alt="" loading="lazy" decoding="async">
  <div class="t">${esc(t.title)}</div><div class="s">${esc(t.album)}</div>
</button>`;

function renderLib(){
  const v = $("#view-lib");
  const q = (v.dataset.q || "").trim().toLowerCase();
  let list = state.tracks;
  if(state.libFilter === "favs") list = list.filter(t => state.favs.has(t.id));
  else if(state.libFilter === "recents") list = state.recents.map(id => state.byId.get(id)).filter(Boolean);
  else if(state.libFilter !== "all") list = list.filter(t => t.cat === state.libFilter);
  if(q) list = list.filter(t => (t.title + " " + t.album).toLowerCase().includes(q));

  v.innerHTML = `
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar audio" value="${esc(v.dataset.q || "")}">
    </div>
    <div class="chips">
      <button class="chip ${state.libFilter==="all"?"on":""}" data-f="all">Todo</button>
      <button class="chip ${state.libFilter==="favs"?"on":""}" data-f="favs">Favoritos</button>
      <button class="chip ${state.libFilter==="recents"?"on":""}" data-f="recents">Recientes</button>
      ${state.cats.map(c => `<button class="chip ${state.libFilter===c?"on":""}" data-f="${esc(c)}">${esc(LABEL(c))}</button>`).join("")}
    </div>
    <div class="list" id="libList"></div>`;

  v.querySelectorAll(".chip").forEach(c => c.onclick = () => { state.libFilter = c.dataset.f; renderLib(); });
  const input = $("#q"); let deb;
  input.oninput = () => { clearTimeout(deb); deb = setTimeout(() => {
    v.dataset.q = input.value; renderLib();
    const ni = $("#q"); ni.focus(); ni.setSelectionRange(ni.value.length, ni.value.length);
  }, 200); };

  const cont = $("#libList");
  if(!list.length){ cont.innerHTML = `<div class="empty">Nada por aquí todavía.</div>`; return; }
  virtualList(cont, list, rowHTML, playList);
}

const rowHTML = t => `<div class="row ${cur()?.id === t.id ? "playing" : ""}" data-id="${t.id}">
  <span class="num">${esc(t.num || "")}</span>
  <div class="meta"><div class="t">${esc(t.title)}</div><div class="s">${esc(t.album)}</div></div>
  <button class="more" data-menu="${t.id}"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
</div>`;

function virtualList(container, items, rowFn, onPlay){
  if(container._io) container._io.disconnect();
  container.innerHTML = "";
  let i = 0;
  const CHUNK = document.body.classList.contains("lowend") ? 30 : 55;
  const sentinel = document.createElement("div"); sentinel.className = "sentinel";
  const add = () => {
    const frag = document.createDocumentFragment();
    const end = Math.min(i + CHUNK, items.length);
    for(; i < end; i++) frag.insertAdjacentHTML("beforeend", rowFn(items[i]));
    container.insertBefore(frag, sentinel);
  };
  const io = new IntersectionObserver(es => { if(es[0].isIntersecting) add(); }, { root: $("#main"), rootMargin: "700px" });
  container._io = io;
  container.appendChild(sentinel); add(); io.observe(sentinel);

  container.onclick = e => {
    const m = e.target.closest("[data-menu]");
    if(m){ openMenu(m.dataset.menu); return; }
    const row = e.target.closest(".row"); if(!row) return;
    const idx = items.findIndex(t => t.id === row.dataset.id);
    if(idx >= 0) onPlay(items, idx);
  };
}

function renderPlaylists(){
  const v = $("#view-pl");
  const names = Object.keys(state.playlists);
  v.innerHTML = `<div class="sect-h"><h2>Playlists</h2><button id="newPl">Nueva</button></div>
    ${names.length ? names.map(n => {
      const first = state.playlists[n].map(id => state.byId.get(id)).find(Boolean);
      return `<button class="row" data-pl="${esc(n)}">
        <img class="art" src="${first?.cover || coverFor("lista")}" alt="" loading="lazy">
        <div class="meta"><div class="t">${esc(n)}</div><div class="s">${state.playlists[n].length} pistas</div></div>
      </button>`;
    }).join("") : `<div class="empty"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><p>Crea tu primera playlist.</p></div>`}`;
  $("#newPl").onclick = () => {
    const n = prompt("Nombre de la playlist"); if(!n) return;
    state.playlists[n] = state.playlists[n] || [];
    LS.set("playlists", state.playlists); renderPlaylists(); toast("Playlist creada");
  };
  v.querySelectorAll("[data-pl]").forEach(b => b.onclick = () => openDetail("playlist", b.dataset.pl));
}

function openDetail(kind, key){
  const v = $("#view-detail");
  let list = [], title = key, sub = "";
  if(kind === "cat"){ list = state.tracks.filter(t => t.cat === key); title = LABEL(key); sub = list.length + " pistas"; }
  if(kind === "playlist"){ list = (state.playlists[key] || []).map(id => state.byId.get(id)).filter(Boolean); sub = list.length + " pistas"; }

  v.innerHTML = `
    <div class="det-head">
      <img class="art" src="${list[0]?.cover || coverFor(key)}" alt="">
      <h2>${esc(title)}</h2><p>${esc(sub)}</p>
      <div class="det-actions">
        <button class="btn" id="dPlay"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Reproducir</button>
        <button class="btn ghost" id="dShuffle">Aleatorio</button>
      </div>
    </div>
    <div class="list" id="detList"></div>`;

  $("#dPlay").onclick = () => playList(list, 0);
  $("#dShuffle").onclick = () => playList(list.slice().sort(()=>Math.random()-.5), 0);
  virtualList($("#detList"), list, rowHTML, playList);
  go("detail");
}

function renderSettings(){
  $("#view-set").innerHTML = `
    <div class="set-item"><div><div class="lab">Animaciones</div><div class="sub">Desactívalas en equipos lentos</div></div>
      <div class="switch ${document.body.classList.contains("lowend")?"on":""}" id="swAnim"></div></div>
    <div class="set-item"><div><div class="lab">Guardar audio offline</div><div class="sub">Cachea lo que escuchas</div></div>
      <div class="switch ${LS.get("offline", true)?"on":""}" id="swOff"></div></div>
    <div class="set-item"><div class="lab">Borrar favoritos, playlists e historial</div>
      <button class="btn ghost" id="wipe" style="padding:9px 16px;font-size:13px">Borrar</button></div>
    <div class="set-item" style="flex-direction:column;align-items:stretch;gap:8px">
      <div class="lab">Fuente de datos</div>
      <div class="sub">${esc(SOURCES[0])} → respaldo raw del repo</div>
    </div>
    <p style="color:var(--muted);font-size:12px;padding:18px 4px;line-height:1.6">
      Instala desde el menú del navegador → "Añadir a pantalla de inicio" para usarlo a pantalla completa.
    </p>`;
  $("#swAnim").onclick = e => { e.currentTarget.classList.toggle("on"); document.body.classList.toggle("lowend", !e.currentTarget.classList.contains("on")); };
  $("#swOff").onclick = e => {
    const on = e.currentTarget.classList.toggle("on"); LS.set("offline", on);
    navigator.serviceWorker?.controller?.postMessage({ type: "offline", on });
  };
  $("#wipe").onclick = () => {
    if(!confirm("¿Borrar datos locales?")) return;
    ["favs","playlists","recents","pos"].forEach(LS.del);
    state.favs.clear(); state.playlists = {}; state.recents = [];
    renderAll(); toast("Datos borrados");
  };
}

/* ---- navegación ---- */
const TITLES = { home:"GELM · Música", lib:"Biblioteca", pl:"Playlists", set:"Ajustes", detail:"" };
function go(view){
  state.view = view;
  ["home","lib","pl","set","detail"].forEach(v => $("#view-"+v).classList.toggle("hide", v !== view));
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.go === view));
  $("#title").textContent = TITLES[view];
  $("#main").scrollTop = 0;
}
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => {
  if(b.dataset.go === "lib"){ state.libFilter = "all"; renderLib(); }
  go(b.dataset.go);
});
$("#btnReload").onclick = () => loadLibrary();

/* ---- reproducción ---- */
function playList(list, index){
  if(!list || !list.length) return;
  state.queue = list.slice(); state.qi = index || 0;
  loadCurrent(true); openPlayer();
}
function playTrack(t){ const i = state.tracks.findIndex(x => x.id === t.id); playList(state.tracks, i); }

function loadCurrent(autoplay){
  const t = cur(); if(!t) return;
  audio.src = t.url;
  $("#pT").textContent = t.title;
  $("#pS").textContent = t.artist + " · " + t.album;
  $("#pArt").src = t.cover;
  $("#pBg").style.backgroundImage = `url("${t.cover}")`;
  $("#miniT").textContent = t.title;
  $("#miniS").textContent = t.album;
  $("#miniArt").src = t.cover;
  $("#mini").classList.remove("hide");
  $("#pFav").classList.toggle("on", state.favs.has(t.id));
  $("#pDur").textContent = "0:00";
  const p = PAL[parseInt(hash(t.cat || "x"),36) % PAL.length];
  document.documentElement.style.setProperty("--accent", p[0]);
  state.recents = [t.id, ...state.recents.filter(i => i !== t.id)].slice(0,60);
  LS.set("recents", state.recents);
  if(autoplay) audio.play().catch(()=>{});
  updateSession();
  document.querySelectorAll(".row.playing").forEach(r => r.classList.remove("playing"));
}

function next(auto){
  if(!state.queue.length) return;
  if(state.repeat === "off" && auto && state.qi >= state.queue.length - 1){ audio.pause(); setPlayIcon(false); return; }
  state.qi = state.shuffle ? Math.floor(Math.random()*state.queue.length) : (state.qi + 1) % state.queue.length;
  loadCurrent(true);
}
function prev(){
  if(audio.currentTime > 3){ audio.currentTime = 0; return; }
  if(!state.queue.length) return;
  state.qi = (state.qi - 1 + state.queue.length) % state.queue.length;
  loadCurrent(true);
}
function toggle(){ if(audio.src) audio.paused ? audio.play() : audio.pause(); }

$("#pPlay").onclick = toggle; $("#miniPlay").onclick = toggle;
$("#pNext").onclick = () => next(false); $("#miniNext").onclick = () => next(false);
$("#pPrev").onclick = prev;

$("#pShuffle").onclick = e => { state.shuffle = !state.shuffle; e.currentTarget.classList.toggle("on", state.shuffle); LS.set("shuffle", state.shuffle); };
$("#pRepeat").onclick = e => {
  state.repeat = state.repeat === "off" ? "all" : state.repeat === "all" ? "one" : "off";
  e.currentTarget.classList.toggle("on", state.repeat !== "off");
  e.currentTarget.style.opacity = state.repeat === "one" ? ".55" : "1";
  LS.set("repeat", state.repeat);
  toast(state.repeat === "off" ? "Repetir desactivado" : state.repeat === "all" ? "Repetir cola" : "Repetir pista");
};
$("#pShuffle").classList.toggle("on", state.shuffle);
$("#pRepeat").classList.toggle("on", state.repeat !== "off");

$("#pFav").onclick = () => {
  const t = cur(); if(!t) return;
  state.favs.has(t.id) ? state.favs.delete(t.id) : state.favs.add(t.id);
  LS.set("favs", [...state.favs]);
  $("#pFav").classList.toggle("on", state.favs.has(t.id));
  renderHome(); renderLib();
};
$("#pList").onclick = () => {
  if(!cur()) return toast("Nada en reproducción");
  openDetail("cat", cur().cat);
};
$("#pSleep").onclick = () => {
  const v = prompt("Minutos para detener (vacío = cancelar):\n15, 30, 45, 60, 90");
  clearTimeout(state.sleepTimer);
  if(!v) return toast("Temporizador cancelado");
  const min = parseInt(v,10); if(!min) return;
  state.sleepTimer = setTimeout(() => { audio.pause(); toast("Reproducción detenida"); }, min*60000);
  toast("Se detendrá en " + min + " min");
};

let seekDrag = false;
$("#pSeek").addEventListener("input", () => seekDrag = true);
$("#pSeek").addEventListener("change", e => {
  if(audio.duration) audio.currentTime = (e.target.value/1000)*audio.duration;
  seekDrag = false;
});

function openPlayer(){ $("#player").classList.add("open"); }
$("#pDown").onclick = () => $("#player").classList.remove("open");
$("#mini").onclick = e => { if(!e.target.closest("button")) openPlayer(); };

/* ---- menú ---- */
function openMenu(id){
  const t = state.byId.get(id); if(!t) return;
  const names = Object.keys(state.playlists);
  $("#menu").innerHTML = `<div class="grab"></div>
    <div class="mi" data-act="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Reproducir</div>
    <div class="mi" data-act="next"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Reproducir siguiente</div>
    <div class="mi" data-act="fav"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.7-9.3-9A5.2 5.2 0 0 1 12 6.6 5.2 5.2 0 0 1 21.3 12c-1.8 4.3-9.3 9-9.3 9z"/></svg>
      ${state.favs.has(id) ? "Quitar de favoritos" : "Añadir a favoritos"}</div>
    <div class="mi" data-act="cat"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>Ir a ${esc(t.album)}</div>
    <div class="mi" data-act="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Añadir a playlist${names.length ? "" : " (crea una)"}</div>`;

  $("#menu").querySelectorAll("[data-act]").forEach(el => el.onclick = () => {
    const a = el.dataset.act;
    if(a === "play") playTrack(t);
    if(a === "next"){ state.queue.splice(state.qi+1, 0, t); toast("Añadida a la cola"); }
    if(a === "fav"){ state.favs.has(id) ? state.favs.delete(id) : state.favs.add(id); LS.set("favs", [...state.favs]); renderHome(); renderLib(); }
    if(a === "cat") openDetail("cat", t.cat);
    if(a === "add"){
      const n = prompt("Nombre de la playlist", names[0] || "");
      if(n){ state.playlists[n] = state.playlists[n] || []; state.playlists[n].push(id); LS.set("playlists", state.playlists); renderPlaylists(); toast("Añadida"); }
    }
    closeMenu();
  });
  $("#menu").classList.add("open"); $("#scrim").classList.add("on");
}
function closeMenu(){ $("#menu").classList.remove("open"); $("#scrim").classList.remove("on"); }
$("#scrim").onclick = closeMenu;
$("#pMenu").onclick = () => cur() && openMenu(cur().id);

/* ---- MediaSession ---- */
function updateSession(){
  if(!("mediaSession" in navigator)) return;
  const t = cur(); if(!t) return;
  try{
    navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, album: t.album });
    navigator.mediaSession.setActionHandler("play", () => audio.play());
    navigator.mediaSession.setActionHandler("pause", () => audio.pause());
    navigator.mediaSession.setActionHandler("previoustrack", prev);
    navigator.mediaSession.setActionHandler("nexttrack", () => next(false));
    navigator.mediaSession.setActionHandler("seekto", d => { audio.currentTime = d.seekTime; });
  }catch(e){}
}

/* ---- arranque ---- */
const cache = LS.get("lib", null);
if(cache?.length){ state.tracks = cache; hydrate(); renderAll(); }
loadLibrary(true);

const last = LS.get("pos", null);
if(last?.id) setTimeout(() => {
  const t = state.byId.get(last.id);
  if(t){ state.queue = [t]; state.qi = 0; loadCurrent(false); audio.currentTime = last.t || 0; }
}, 1000);

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw-player.js").catch(()=>{});
  navigator.storage?.persist?.();
}
</script>
